name: Build and run Gfxstream tests via Bazel

on:
  workflow_call:
    inputs:
      # Which github runner to use:
      runner:
        type: string
        required: true

      # Additional args used in `bazel build <args>` and `bazel test <args>`:
      additional-bazel-args:
        type: string
        default: ''

      # Additional args used only in `bazel test <args>`:
      additional-bazel-test-args:
        type: string
        default: ''

      # Cache configuration identifier used to isolate incompatible build
      # configurations (e.g. 'default' vs 'asan') into separate cache keys:
      cache-config:
        type: string
        default: 'default'

      # Which targets to build. Defaults to everything, but platforms that can
      # not build the full target graph (e.g. macOS, which lacks the Linux-only
      # mesa/libdrm/guest dependencies) can override this with a curated list.
      build-targets:
        type: string
        default: '...'

      # Optional Mesa GitLab merge request number (e.g. '45927') to patch into
      # third_party/mesa before building and testing:
      mesa-merge-request-number:
        type: string
        default: ''

      # Whether or not to run the `bazel test` step:
      run-tests:
        type: boolean
        default: true

      # Whether to keep the Android SDK and NDK preinstalled on the runner,
      # which the free disk space step removes otherwise:
      keep-android-sdk:
        type: boolean
        default: false

      # Which tests to run. Defaults to the full suite; platforms that can only
      # build part of the target graph can override this with a curated list.
      test-targets:
        type: string
        default: >-
          host:gfxstream_framebuffer_tests
          host/vulkan:gfxstream_compositorvk_tests
          host/vulkan:gfxstream_emulatedphysicalmemory_tests
          host/vulkan:gfxstream_vk_memory_allocation_helper_tests
          host/vulkan:vk_common_operations_tests
          host/vulkan:vk_format_utils_tests
          tests/deqp:deqp_vk_smoke_tests
          tests/end2end:gfxstream_end2end_tests

permissions:
  contents: read

jobs:
  presubmit_bazel_workflow:
    runs-on: ${{ inputs.runner }}
    steps:
    - name: Free disk space
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
      with:
        android: ${{ !inputs.keep-android-sdk }}
        tool-cache: true

    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false

    - name: Apply Mesa merge request patch
      if: inputs.mesa-merge-request-number != ''
      env:
        MESA_MR: ${{ inputs.mesa-merge-request-number }}
      run: |
        if [[ ! "${MESA_MR}" =~ ^[0-9]+$ ]]; then
          echo "Error: mesa-merge-request-number must be numeric, got '${MESA_MR}'" >&2
          exit 1
        fi
        PATCH_NAME="PATCH.mr_${MESA_MR}.patch"
        curl -sSfL "https://gitlab.freedesktop.org/mesa/mesa/-/merge_requests/${MESA_MR}.patch" \
          -o "third_party/mesa/${PATCH_NAME}"
        sed -i "s|# PLACEHOLDER_FOR_MESA_MR_PATCH_FILE|\"//third_party/mesa:${PATCH_NAME}\",|" \
          third_party/mesa/mesa.MODULE.bazel
        git diff third_party/mesa/mesa.MODULE.bazel

    - name: Install bazel (Linux)
      if: runner.os == 'Linux'
      run: sudo bash toolchain/bazel/install_bazel.sh

    - name: Install toolchain dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo bash toolchain/bazel/install_toolchain_dependencies.sh

    - name: Install runtime dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y libvulkan1

    - name: Install bazel (macOS)
      if: runner.os == 'macOS'
      run: brew install bazelisk

    - name: Load cache config
      run: cat .config/cache-config.env >> $GITHUB_ENV

    - name: Mount Bazel cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
      with:
        path: "~/bazel-disk-cache"
        key: ${{ format('{0}-{1}-bazel-disk-cache-{2}-{3}-{4}-{5}-', runner.os, runner.arch, env.CACHE_VERSION, inputs.cache-config, github.ref_name, github.sha) }}
        restore-keys: |
          ${{ format('{0}-{1}-bazel-disk-cache-{2}-{3}-{4}-', runner.os, runner.arch, env.CACHE_VERSION, inputs.cache-config, github.ref_name) || '' }}
          ${{ format('{0}-{1}-bazel-disk-cache-{2}-{3}-main-', runner.os, runner.arch, env.CACHE_VERSION, inputs.cache-config) || '' }}
          ${{ format('{0}-{1}-bazel-disk-cache-{2}-{3}-', runner.os, runner.arch, env.CACHE_VERSION, inputs.cache-config) || '' }}

    - name: Build
      # Workflow inputs reach the script through the environment rather than
      # being expanded into it, so that their contents can never be parsed as
      # shell code. They are deliberately left unquoted below so that the shell
      # still splits them into separate arguments.
      env:
        BUILD_TARGETS: ${{ inputs.build-targets }}
        ADDITIONAL_BAZEL_ARGS: ${{ inputs.additional-bazel-args }}
      run: |
        bazel build $BUILD_TARGETS \
          --disk_cache=$HOME/bazel-disk-cache \
          --verbose_failures \
          $ADDITIONAL_BAZEL_ARGS

    - name: Test
      if: ${{ inputs.run-tests }}
      env:
        TEST_TARGETS: ${{ inputs.test-targets }}
        ADDITIONAL_BAZEL_ARGS: ${{ inputs.additional-bazel-args }}
        ADDITIONAL_BAZEL_TEST_ARGS: ${{ inputs.additional-bazel-test-args }}
      run: |
        bazel test $TEST_TARGETS \
          --disk_cache=$HOME/bazel-disk-cache \
          --test_output=streamed \
          --verbose_failures \
          $ADDITIONAL_BAZEL_ARGS \
          $ADDITIONAL_BAZEL_TEST_ARGS
