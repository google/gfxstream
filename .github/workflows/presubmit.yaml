name: Gfxstream Presubmit

on:
  pull_request:
  push:
    branches-ignore:
      - main  # push events to main branch occur after PRs are merged, when the same checks were run

permissions:
  contents: read
  packages: read

concurrency:
  # limits the workflow to a single run per branch/PR
  group: ${{ github.workflow }}-${{ github.ref }}
  # previous runs are cancelled when a new run is started
  cancel-in-progress: true

jobs:
  buildozer:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false
    - name: Install go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
      with:
        go-version: 'stable'
    - name: Install buildozer
      run: go install github.com/bazelbuild/buildtools/buildozer@latest
    - name: Validate formatting
      if: '!cancelled()'
      run: |
        if [[ $(buildozer '//...:__pkg__' format 2>&1) ]]; then
          echo "Please format BUILD.bazel files with \"buildozer '//...:__pkg__' format\"";
          exit 1;
        fi
    - name: Validate no unused loads
      if: '!cancelled()'
      run: |
        if [[ $(buildozer -stdout=true '//...:__pkg__' 'fix unusedLoads') ]]; then
          buildozer '//...:__pkg__' 'fix unusedLoads'
          echo "Please remove unused 'load' statements with \"buildozer '//...:__pkg__' 'fix unusedLoads'\"";
          exit 1;
        fi

  build_bazel_linux_x86_64_lavapipe:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_lavapipe
      cache-config: lavapipe
      runner: ubuntu-22.04
      run-tests: false
      save-cache-delta: true

  test_bazel_linux_x86_64_lavapipe_gfxstream_tests:
    needs:
      - build_bazel_linux_x86_64_lavapipe
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_lavapipe
      cache-config: lavapipe
      restore-cache-delta: true
      run-build: false
      runner: ubuntu-22.04
      test-targets: >-
        host:gfxstream_framebuffer_tests
        host/vulkan:gfxstream_compositorvk_tests
        host/vulkan:gfxstream_emulatedphysicalmemory_tests
        host/vulkan:gfxstream_vk_memory_allocation_helper_tests
        host/vulkan:vk_common_operations_tests
        host/vulkan:vk_format_utils_tests
        tests/end2end:gfxstream_end2end_tests

  test_bazel_linux_x86_64_lavapipe_deqp_tests:
    needs:
      - build_bazel_linux_x86_64_lavapipe
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_lavapipe
      cache-config: lavapipe
      restore-cache-delta: true
      run-build: false
      runner: ubuntu-22.04
      test-targets: >-
        tests/deqp:deqp_vk_presubmit_tests

  build_bazel_linux_x86_64_swiftshader:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_swiftshader
      cache-config: swiftshader
      runner: ubuntu-22.04
      run-tests: false
      save-cache-delta: true

  test_bazel_linux_x86_64_swiftshader_gfxstream_tests:
    needs:
      - build_bazel_linux_x86_64_swiftshader
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_swiftshader
      cache-config: swiftshader
      restore-cache-delta: true
      run-build: false
      runner: ubuntu-22.04
      test-targets: >-
        host:gfxstream_framebuffer_tests
        host/vulkan:gfxstream_compositorvk_tests
        host/vulkan:gfxstream_emulatedphysicalmemory_tests
        host/vulkan:gfxstream_vk_memory_allocation_helper_tests
        host/vulkan:vk_common_operations_tests
        host/vulkan:vk_format_utils_tests
        tests/end2end:gfxstream_end2end_tests

  test_bazel_linux_x86_64_swiftshader_deqp_tests:
    needs:
      - build_bazel_linux_x86_64_swiftshader
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_swiftshader
      cache-config: swiftshader
      restore-cache-delta: true
      run-build: false
      runner: ubuntu-22.04
      test-targets: >-
        tests/deqp:deqp_vk_presubmit_tests

  test_bazel_linux_x86_64_swiftshader_cuttlefish_tests:
    needs:
      - build_bazel_linux_x86_64_swiftshader
    uses: ./.github/workflows/test_cuttlefish_container_ci.yaml
    with:
      restore-cache-delta: true

  build_bazel_linux_x86_64_swiftshader_asan:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      # TODO(b/475886246): fix and remove `detect_leaks=0`
      # TODO(b/475885975): fix and remove `detect_odr_violation=0`
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_swiftshader --config=asan --test_env=ASAN_OPTIONS=detect_leaks=0:detect_odr_violation=0
      cache-config: swiftshader-asan
      runner: ubuntu-22.04
      run-tests: false
      save-cache-delta: true

  test_bazel_linux_x86_64_swiftshader_asan_gfxstream_tests:
    needs:
      - build_bazel_linux_x86_64_swiftshader_asan
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      # TODO(b/475886246): fix and remove `detect_leaks=0`
      # TODO(b/475885975): fix and remove `detect_odr_violation=0`
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_swiftshader --config=asan --test_env=ASAN_OPTIONS=detect_leaks=0:detect_odr_violation=0
      cache-config: swiftshader-asan
      restore-cache-delta: true
      run-build: false
      runner: ubuntu-22.04
      test-targets: >-
        host:gfxstream_framebuffer_tests
        host/vulkan:gfxstream_compositorvk_tests
        host/vulkan:gfxstream_emulatedphysicalmemory_tests
        host/vulkan:gfxstream_vk_memory_allocation_helper_tests
        host/vulkan:vk_common_operations_tests
        host/vulkan:vk_format_utils_tests
        tests/end2end:gfxstream_end2end_tests

  test_bazel_linux_x86_64_swiftshader_asan_deqp_tests:
    needs:
      - build_bazel_linux_x86_64_swiftshader_asan
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      # TODO(b/475886246): fix and remove `detect_leaks=0`
      # TODO(b/475885975): fix and remove `detect_odr_violation=0`
      additional-bazel-args: --graphics_drivers=gles_angle_vulkan_swiftshader --config=asan --test_env=ASAN_OPTIONS=detect_leaks=0:detect_odr_violation=0
      cache-config: swiftshader-asan
      restore-cache-delta: true
      run-build: false
      runner: ubuntu-22.04
      test-targets: >-
        tests/deqp:deqp_vk_smoke_tests

  build_bazel_linux_arm64:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: ubuntu-22.04-arm
      # The arm runner is too slow:
      run-tests: false

  build_bazel_android_arm64:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: ubuntu-22.04
      # Build with the NDK preinstalled on the runner, which ANDROID_NDK_HOME
      # points to.
      keep-android-sdk: true
      # Build the host backend libraries, which are the Android deliverable
      # (embedded in an Android app).
      build-targets: >-
        //host:gfxstream_backend_static
        //host:gfxstream_backend
      additional-bazel-args: --config=android_arm64
      cache-config: androidndk
      # Android binaries can not run on the Linux runner:
      run-tests: false

  build_bazel_android_x86_64:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: ubuntu-22.04
      # Build with the NDK preinstalled on the runner, which ANDROID_NDK_HOME
      # points to.
      keep-android-sdk: true
      # Build the host backend libraries, which are the Android deliverable
      # (embedded in an Android app).
      build-targets: >-
        //host:gfxstream_backend_static
        //host:gfxstream_backend
      additional-bazel-args: --config=android_x86_64
      cache-config: androidndk-x86_64
      # Android binaries can not run on the Linux runner:
      run-tests: false

  build_bazel_macos_arm64:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: macos-26
      # macOS can not build the full target graph: the Linux-only mesa/libdrm
      # guest dependencies and swiftshader's bundled LLVM (which has no macOS
      # config) do not build on Darwin. Build the host backend libraries, which
      # are the macOS deliverable and mirror the CMake/Meson host builds below.
      build-targets: >-
        //host:gfxstream_backend_static
        //host:gfxstream_backend_shared
        //host:gfxstream_backend
      # Only tests that need no graphics driver run: macOS has no driver
      # environment here yet. The WorkerThread case is not run anywhere yet
      # and fails on every platform, so it stays out until it is fixed.
      test-targets: >-
        common/base:gfxstream_common_base_tests
      additional-bazel-args: >-
        --test_arg=--gtest_filter=-WorkerThread.TheReturnedFutureFromEnqueueShouldBeReadyBeforeTheWorkerStarts

  build_cmake_linux_x86_64:
    uses: ./.github/workflows/presubmit_cmake.yaml
    with:
      runner: ubuntu-22.04

  build_cmake_macos_arm64:
    uses: ./.github/workflows/presubmit_cmake.yaml
    with:
      runner: macos-26

  build_meson_linux_x86_64:
    uses: ./.github/workflows/presubmit_meson.yaml
    with:
      runner: ubuntu-22.04

  build_meson_macos_arm64:
    uses: ./.github/workflows/presubmit_meson.yaml
    with:
      runner: macos-26

  build_meson_windows_x86_64:
    uses: ./.github/workflows/presubmit_meson.yaml
    with:
      runner: windows-latest

  presubmit-success:
    name: presubmit-success
    if: always()
    runs-on: ubuntu-22.04
    needs:
      - buildozer
      - build_bazel_android_arm64
      - build_bazel_android_x86_64
      - build_bazel_linux_arm64
      - build_bazel_linux_x86_64_lavapipe
      - build_bazel_linux_x86_64_swiftshader
      - build_bazel_linux_x86_64_swiftshader_asan
      - build_bazel_macos_arm64
      - build_cmake_linux_x86_64
      - build_cmake_macos_arm64
      - build_meson_linux_x86_64
      - build_meson_macos_arm64
      - build_meson_windows_x86_64
      - test_bazel_linux_x86_64_lavapipe_deqp_tests
      - test_bazel_linux_x86_64_lavapipe_gfxstream_tests
      - test_bazel_linux_x86_64_swiftshader_asan_deqp_tests
      - test_bazel_linux_x86_64_swiftshader_asan_gfxstream_tests
      - test_bazel_linux_x86_64_swiftshader_deqp_tests
      - test_bazel_linux_x86_64_swiftshader_gfxstream_tests
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: ${results}"
          for r in ${results}; do
            case "${r}" in
              failure|cancelled)
                echo "A required job did not pass."; exit 1;;
            esac
          done

